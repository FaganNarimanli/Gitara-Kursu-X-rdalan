<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gitara Kursu — İdarəetmə</title>
<style>
:root { --site-primary: #253b35; --site-on-primary: #ffffff; --site-secondary: #e9e3d7; --site-on-secondary: #28342f; --site-background: #f8f9fa; --site-on-background: #212529; --site-font-body: Inter, system-ui, sans-serif; --surface: #ffffff; --surface-2: #f1f3f5; --line: #dee2e6; --muted: #6c757d; --green: #2b4c3f; --red: #c92a2a; }
* { box-sizing: border-box; }
body { margin: 0; font-family: var(--site-font-body); background: var(--site-background); color: var(--site-on-background); }
#app { min-height: 100vh; width: 100%; }
button, input, select { font: inherit; color: #212529; }
button { cursor: pointer; }
.layout { display: grid; grid-template-columns: 248px minmax(0,1fr); min-height: 100vh; }
aside { background: var(--site-primary); color: var(--site-on-primary); padding: 25px 16px; display: flex; flex-direction: column; gap: 24px; }
.brand { display:flex; align-items:center; gap:12px; padding: 0 10px; }
.brand-mark { width:40px; height:40px; border-radius: 12px; display:grid; place-items:center; background:rgba(255,255,255,.14); font-size:21px; }
nav { display:grid; gap:6px; }
.nav-btn { border:0; color:rgba(255,255,255,.78); background:transparent; text-align:left; padding:12px 14px; border-radius:10px; display:flex; align-items:center; gap:12px; font-size:14px; }
.nav-btn.active { background:rgba(255,255,255,.15); color:white; font-weight:600; }
.side-note { margin-top:auto; background:rgba(255,255,255,.09); border:1px solid rgba(255,255,255,.1); border-radius:13px; padding:14px; font-size:12px; color:rgba(255,255,255,.8); }
main { min-width:0; padding: 24px 32px 40px; }
.topbar { display:flex; justify-content:space-between; align-items:center; margin-bottom:24px; flex-wrap:wrap; gap:14px; }
h1 { font-size:24px; margin:0; font-weight:750; }
.primary-btn, .secondary-btn { border:0; border-radius:10px; padding:10px 16px; font-weight:650; font-size:13px; display:inline-flex; align-items:center; gap:6px; }
.primary-btn { background:var(--site-primary); color:white; }
.secondary-btn { background:var(--surface); border:1px solid var(--line); }
.page { display:none; }
.page.active { display:block; }
.section-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:18px; }
.stats { display:grid; grid-template-columns:repeat(auto-fit, minmax(180px, 1fr)); gap:14px; margin-bottom:20px; }
.stat { background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:16px; }
.stat-value { font-size:22px; font-weight:750; margin-top:8px; }
.table-wrap { overflow-x:auto; border:1px solid var(--line); border-radius:12px; background:#ffffff; margin-bottom:10px; }
table { width:100%; border-collapse:collapse; min-width:600px; }
th { text-align:left; background:var(--surface-2); color:var(--muted); font-size:11px; padding:12px 14px; }
td { padding:12px 14px; border-top:1px solid var(--line); font-size:12px; }
.actions { display:flex; gap:6px; }
.mini-btn { border:1px solid var(--line); background:var(--surface); border-radius:8px; padding:6px 10px; font-size:11px; }
.modal-backdrop { position:fixed; inset:0; background:rgba(0,0,0,.45); display:none; align-items:center; justify-content:center; padding:16px; z-index:100; }
.modal-backdrop.open { display:flex; }
.modal { width:min(500px,100%); background:#ffffff; border-radius:16px; padding:20px; }
.modal-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; }
.close { border:0; background:var(--surface-2); border-radius:8px; width:30px; height:30px; }
.form-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.field { display:grid; gap:4px; }
.field label { font-size:11px; font-weight:600; color:var(--muted); }
.field.full { grid-column:1/-1; }
.week-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(130px, 1fr)); gap:10px; }
.day-col { background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:12px; min-height:150px; }
.lesson-card { background:var(--surface-2); border-left:3px solid var(--green); border-radius:8px; padding:8px; margin-bottom:8px; }
.pill { padding:4px 8px; border-radius:12px; font-size:11px; font-weight:600; background:var(--surface-2); }
@media(max-width:850px) {
  .layout { display:block; }
  aside { flex-direction:row; justify-content:space-between; padding:12px; }
  .side-note { display:none; }
  main { padding:16px; }
}
</style>
</head>
<body>
<div id="app">
<div class="layout">
<aside>
  <div class="brand"><div class="brand-mark">♬</div><strong>Gitara Kursu</strong></div>
  <nav>
    <button class="nav-btn active" data-page="dashboard">▦ İcmal</button>
    <button class="nav-btn" data-page="students">♙ Tələbələr</button>
    <button class="nav-btn" data-page="schedule">▦ Cədvəl</button>
    <button class="nav-btn" data-page="attendance">✓ Davamiyyət</button>
    <button class="nav-btn" data-page="payments">₼ Ödənişlər</button>
  </nav>
  <div class="side-note">Bulud Sinxronizasiyası</div>
</aside>
<main>
  <header class="topbar">
    <div><h1 id="pageTitle">İcmal</h1></div>
    <div><button class="primary-btn" id="quickAdd">＋ Yeni tələbə</button></div>
  </header>

  <section class="page active" id="dashboard">
    <div class="stats">
      <div class="stat"><div>Aktiv tələbələr</div><div class="stat-value" id="statStudents">0</div></div>
      <div class="stat"><div>Bu ay gəlir</div><div class="stat-value" id="statIncome">0 ₼</div></div>
    </div>
  </section>

  <section class="page" id="students">
    <div class="section-head"><h2>Tələbələr</h2><button class="primary-btn" id="addStudent">＋ Tələbə əlavə et</button></div>
    <div class="table-wrap"><table><thead><tr><th>TƏLƏBƏ</th><th>ƏLAQƏ</th><th>QEYDİYYAT</th><th>PAKET</th><th>AYLIQ</th><th>STATUS</th><th>ƏMƏLİYYAT</th></tr></thead><tbody id="studentsBody"></tbody></table></div>
  </section>

  <section class="page" id="schedule">
    <div class="section-head"><h2>Cədvəl</h2><button class="primary-btn" id="addLesson">＋ Dərs əlavə et</button></div>
    <div class="week-grid" id="weekGrid"></div>
  </section>

  <section class="page" id="attendance">
    <div class="section-head"><h2>Davamiyyət</h2><button class="primary-btn" id="addAttendance">＋ Qeyd et</button></div>
    <div class="table-wrap"><table><thead><tr><th>TARİX</th><th>TƏLƏBƏ</th><th>İŞTİRAK</th><th>ƏMƏLİYYAT</th></tr></thead><tbody id="attendanceBody"></tbody></table></div>
  </section>

  <section class="page" id="payments">
    <div class="section-head"><h2>Ödənişlər və Paketlər</h2><button class="primary-btn" id="addPayment">＋ Ödəniş əlavə et</button></div>
    <div class="table-wrap"><table><thead><tr><th>TƏLƏBƏ</th><th>ÜMUMİ PAKET</th><th>KEÇİLƏN</th><th>QALAN</th><th>TARİX</th><th>MƏBLƏĞ</th><th>ƏMƏLİYYAT</th></tr></thead><tbody id="paymentsBody"></tbody></table></div>
  </section>
</main>
</div>
</div>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal">
    <div class="modal-head"><h3 id="modalTitle">Qeyd</h3><button class="close" id="closeModal">×</button></div>
    <form id="modalForm"><div id="modalFields"></div>
      <div style="display:flex; justify-content:flex-end; gap:10px; margin-top:16px;">
        <button type="button" class="secondary-btn" id="cancelModal">Ləğv et</button>
        <button type="submit" class="primary-btn">Yadda saxla</button>
      </div>
    </form>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyCk5oHCOKemJfMwxVCgvDskBTVQJ9hXxRY",
  authDomain: "gitara-kursu.firebaseapp.com",
  databaseURL: "https://gitara-kursu-default-rtdb.firebaseio.com",
  projectId: "gitara-kursu",
  storageBucket: "gitara-kursu.firebasestorage.app",
  messagingSenderId: "1018395422952",
  appId: "1:1018395422952:web:dd1ac19551878141cc195d"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const days = ['Bazar ertəsi','Çərşənbə axşamı','Çərşənbə','Cümə axşamı','Cümə','Şənbə','Bazar'];

let data = {students:[], lessons:[], payments:[], attendance:[]};
let modalSave = null;

onValue(ref(db, 'kursData'), (snapshot) => {
  const d = snapshot.val();
  if (d) { data = { students: d.students||[], lessons: d.lessons||[], payments: d.payments||[], attendance: d.attendance||[] }; }
  renderAll();
});

function saveData() { set(ref(db, 'kursData'), data); }

document.querySelectorAll('.nav-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    const pId = btn.getAttribute('data-page');
    document.getElementById(pId).classList.add('active');
    document.getElementById('pageTitle').textContent = btn.textContent;
  });
});

function renderAll() {
  document.getElementById('statStudents').textContent = data.students.filter(s=>s.status==='active').length;
  document.getElementById('statIncome').textContent = data.payments.reduce((sum,p)=>sum+Number(p.amount||0),0) + ' ₼';
  
  // Tələbələr
  document.getElementById('studentsBody').innerHTML = data.students.map(s => `
    <tr><td><b>${s.name}</b></td><td>${s.phone||'—'}</td><td>${s.regDate||'—'}</td><td>${s.packageLessons||8} dərs</td><td>${s.monthlyFee||0} ₼</td>
    <td><span class="pill">${s.status==='active'?'Aktiv':'Passiv'}</span></td>
    <td><div class="actions"><button class="mini-btn" style="color:var(--green);" onclick="editStudent('${s.id}')">Redaktə</button><button class="mini-btn" style="color:var(--red);" onclick="deleteStudent('${s.id}')">Sil</button></div></td></tr>
  `).join('');

  // Cədvəl
  document.getElementById('weekGrid').innerHTML = days.map(d => {
    const dLessons = data.lessons.filter(l => l.day === d);
    return `<div class="day-col"><b>${d}</b><div style="margin-top:10px;">${dLessons.map(l=>`
      <div class="lesson-card"><b>${l.studentName}</b><small style="display:block;">${l.time} (${l.lessonType||'Fərdi'} - ${l.duration||60} dəq)</small>
      <div style="margin-top:4px;"><button style="color:var(--green); border:0; background:none;" onclick="editLesson('${l.id}')">Redaktə</button> <button style="color:var(--red); border:0; background:none;" onclick="deleteLesson('${l.id}')">Sil</button></div></div>
    `).join('')}</div></div>`;
  }).join('');

  // Davamiyyət
  document.getElementById('attendanceBody').innerHTML = data.attendance.slice().reverse().map(a => `
    <tr><td>${a.date}</td><td><b>${a.studentName}</b></td><td><span class="pill">${a.status}</span></td>
    <td><div class="actions"><button class="mini-btn" style="color:var(--green);" onclick="editAttendance('${a.id}')">Redaktə</button><button class="mini-btn" style="color:var(--red);" onclick="deleteAttendance('${a.id}')">Sil</button></div></td></tr>
  `).join('');

  // Ödənişlər
  document.getElementById('paymentsBody').innerHTML = data.students.filter(s=>s.status==='active').map(s => {
    const attCount = data.attendance.filter(a=>a.studentId===s.id && a.status==='İştirak etdi').length;
    const totalPkg = Number(s.packageLessons||8);
    const pay = data.payments.find(p=>p.studentId===s.id);
    return `<tr><td><b>${s.name}</b></td><td>${totalPkg} dərs</td><td>${attCount} dərs</td><td><b>${Math.max(0, totalPkg-attCount)} dərs</b></td>
    <td>${pay?pay.date:'—'}</td><td>${pay?pay.amount+' ₼':'Ödənilməyib'}</td>
    <td><div class="actions">${pay?`<button class="mini-btn" style="color:var(--green);" onclick="editPayment('${pay.id}')">Redaktə</button><button class="mini-btn" style="color:var(--red);" onclick="deletePayment('${pay.id}')">Sil</button>`:`<button class="mini-btn" onclick="addPay('${s.id}')">＋ Ödəniş</button>`}</div></td></tr>`;
  }).join('');
}

const backdrop = document.getElementById('modalBackdrop');
const modalFields = document.getElementById('modalFields');
document.getElementById('closeModal').onclick = () => backdrop.classList.remove('open');
document.getElementById('cancelModal').onclick = () => backdrop.classList.remove('open');

// Tələbə Əlavə / Redaktə / Sil
const openStudent = (st = null) => {
  document.getElementById('modalTitle').textContent = st ? 'Tələbəni Redaktə Et' : 'Yeni Tələbə';
  modalFields.innerHTML = `
    <div class="form-grid"><div class="field full"><label>Ad Soyad</label><input type="text" id="mName" value="${st?st.name:''}" required></div>
    <div class="field"><label>Telefon</label><input type="text" id="mPhone" value="${st?st.phone:''}"></div>
    <div class="field"><label>Tarix</label><input type="date" id="mReg" value="${st?st.regDate:new Date().toISOString().slice(0,10)}"></div>
    <div class="field"><label>Paket Dərs</label><input type="number" id="mPkg" value="${st?st.packageLessons:8}"></div>
    <div class="field"><label>Ödəniş (₼)</label><input type="number" id="mFee" value="${st?st.monthlyFee:80}"></div>
    <div class="field full"><label>Status</label><select id="mSt"><option value="active" ${st&&st.status==='active'?'selected':''}>Aktiv</option><option value="inactive" ${st&&st.status==='inactive'?'selected':''}>Passiv</option></select></div></div>`;
  modalSave = () => {
    if (st) { st.name=mName.value; st.phone=mPhone.value; st.regDate=mReg.value; st.packageLessons=Number(mPkg.value); st.monthlyFee=Number(mFee.value); st.status=mSt.value; }
    else { data.students.push({ id:'s_'+Date.now(), name:mName.value, phone:mPhone.value, regDate:mReg.value, packageLessons:Number(mPkg.value), monthlyFee:Number(mFee.value), status:mSt.value }); }
    saveData(); backdrop.classList.remove('open');
  };
  backdrop.classList.add('open');
};

document.getElementById('quickAdd').onclick = () => openStudent();
document.getElementById('addStudent').onclick = () => openStudent();
window.editStudent = (id) => openStudent(data.students.find(s=>s.id===id));
window.deleteStudent = (id) => { if(confirm('Silinsin?')){ data.students=data.students.filter(s=>s.id!==id); saveData(); } };

// Cədvəl Dərs Əlavə / Redaktə / Sil
const openLesson = (l = null) => {
  document.getElementById('modalTitle').textContent = l ? 'Dərsi Redaktə Et' : 'Yeni Dərs';
  modalFields.innerHTML = `
    <div class="form-grid"><div class="field full"><label>Tələbə</label><select id="mLSt">${data.students.map(s=>`<option value="${s.id}" ${l&&l.studentId===s.id?'selected':''}>${s.name}</option>`).join('')}</select></div>
    <div class="field"><label>Növ</label><select id="mLType"><option value="Fərdi" ${l&&l.lessonType==='Fərdi'?'selected':''}>Fərdi</option><option value="Qrup" ${l&&l.lessonType==='Qrup'?'selected':''}>Qrup</option></select></div>
    <div class="field"><label>Müddət (dəq)</label><input type="number" id="mLDur" value="${l?l.duration:60}"></div>
    <div class="field"><label>Gün</label><select id="mLDay">${days.map(d=>`<option value="${d}" ${l&&l.day===d?'selected':''}>${d}</option>`).join('')}</select></div>
    <div class="field"><label>Saat</label><input type="time" id="mLTime" value="${l?l.time:'15:00'}"></div></div>`;
  modalSave = () => {
    const st = data.students.find(x=>x.id===mLSt.value);
    if(l){ l.studentId=mLSt.value; l.studentName=st?st.name:''; l.lessonType=mLType.value; l.duration=mLDur.value; l.day=mLDay.value; l.time=mLTime.value; }
    else{ data.lessons.push({ id:'l_'+Date.now(), studentId:mLSt.value, studentName:st?st.name:'', lessonType:mLType.value, duration:mLDur.value, day:mLDay.value, time:mLTime.value }); }
    saveData(); backdrop.classList.remove('open');
  };
  backdrop.classList.add('open');
};
document.getElementById('addLesson').onclick = () => openLesson();
window.editLesson = (id) => openLesson(data.lessons.find(l=>l.id===id));
window.deleteLesson = (id) => { if(confirm('Silinsin?')){ data.lessons=data.lessons.filter(l=>l.id!==id); saveData(); } };

// Davamiyyət
const openAtt = (a = null) => {
  document.getElementById('modalTitle').textContent = a ? 'Davamiyyəti Redaktə Et' : 'Davamiyyət Qeyd Et';
  modalFields.innerHTML = `
    <div class="form-grid"><div class="field full"><label>Tələbə</label><select id="mASt">${data.students.map(s=>`<option value="${s.id}" ${a&&a.studentId===s.id?'selected':''}>${s.name}</option>`).join('')}</select></div>
    <div class="field"><label>Tarix</label><input type="date" id="mADate" value="${a?a.date:new Date().toISOString().slice(0,10)}"></div>
    <div class="field"><label>İştirak</label><select id="mASts"><option value="İştirak etdi" ${a&&a.status==='İştirak etdi'?'selected':''}>İştirak etdi</option><option value="İştirak etmədi" ${a&&a.status==='İştirak etmədi'?'selected':''}>İştirak etmədi</option></select></div></div>`;
  modalSave = () => {
    const st = data.students.find(x=>x.id===mASt.value);
    if(a){ a.studentId=mASt.value; a.studentName=st?st.name:''; a.date=mADate.value; a.status=mASts.value; }
    else{ data.attendance.push({ id:'a_'+Date.now(), studentId:mASt.value, studentName:st?st.name:'', date:mADate.value, status:mASts.value }); }
    saveData(); backdrop.classList.remove('open');
  };
  backdrop.classList.add('open');
};
document.getElementById('addAttendance').onclick = () => openAtt();
window.editAttendance = (id) => openAtt(data.attendance.find(a=>a.id===id));
window.deleteAttendance = (id) => { if(confirm('Silinsin?')){ data.attendance=data.attendance.filter(a=>a.id!==id); saveData(); } };

// Ödəniş
const openPayModal = (p = null, sId = null) => {
  document.getElementById('modalTitle').textContent = p ? 'Ödənişi Redaktə Et' : 'Ödəniş Əlavə Et';
  modalFields.innerHTML = `
    <div class="form-grid"><div class="field full"><label>Tələbə</label><select id="mPSt">${data.students.map(s=>`<option value="${s.id}" ${(p&&p.studentId===s.id)||(sId===s.id)?'selected':''}>${s.name}</option>`).join('')}</select></div>
    <div class="field"><label>Məbləğ (₼)</label><input type="number" id="mPAmt" value="${p?p.amount:80}"></div>
    <div class="field"><label>Tarix</label><input type="date" id="mPDate" value="${p?p.date:new Date().toISOString().slice(0,10)}"></div></div>`;
  modalSave = () => {
    const st = data.students.find(x=>x.id===mPSt.value);
    if(p){ p.studentId=mPSt.value; p.studentName=st?st.name:''; p.amount=Number(mPAmt.value); p.date=mPDate.value; }
    else{ data.payments.push({ id:'p_'+Date.now(), studentId:mPSt.value, studentName:st?st.name:'', amount:Number(mPAmt.value), date:mPDate.value }); }
    saveData(); backdrop.classList.remove('open');
  };
  backdrop.classList.add('open');
};
document.getElementById('addPayment').onclick = () => openPayModal();
window.addPay = (sId) => openPayModal(null, sId);
window.editPayment = (id) => openPayModal(data.payments.find(p=>p.id===id));
window.deletePayment = (id) => { if(confirm('Silinsin?')){ data.payments=data.payments.filter(p=>p.id!==id); saveData(); } };

document.getElementById('modalForm').onsubmit = (e) => { e.preventDefault(); if(modalSave) modalSave(); };
</script>
</body>
</html>
