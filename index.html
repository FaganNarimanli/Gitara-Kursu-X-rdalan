<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Gitara Kursu — İdarəetmə</title>
<style>
:root {
  --site-primary: #253b35;
  --site-on-primary: #ffffff;
  --site-secondary: #e9e3d7;
  --site-on-secondary: #28342f;
  --site-background: #f8f9fa;
  --site-on-background: #212529;
  --site-font-body: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
body { margin: 0; font-family: var(--site-font-body); background: var(--site-background); color: var(--site-on-background); -webkit-tap-highlight-color: transparent; }
#app { min-height: 100vh; width: 100%; background-color: #f8f9fa; }
:root { --surface: #ffffff; --surface-2: #f1f3f5; --line: #dee2e6; --muted: #6c757d; --green: #2b4c3f; --red: #c92a2a; --amber: #f08c00; --shadow: 0 4px 15px rgba(0,0,0,.05); }

button, input, select, textarea { font: inherit; color: #212529; }
button { cursor: pointer; }

.layout { display: grid; grid-template-columns: 248px minmax(0,1fr); min-height: 100vh; }
aside { background: var(--site-primary); color: var(--site-on-primary); padding: 25px 16px; display: flex; flex-direction: column; gap: 24px; }
.brand { display:flex; align-items:center; gap:12px; padding: 0 10px; }
.brand-mark { width:40px; height:40px; border-radius: 12px; display:grid; place-items:center; background:rgba(255,255,255,.14); font-size:21px; }
.brand strong { display:block; font-size:15px; }
.brand small { display:block; opacity:.66; font-size:11px; margin-top:2px; }
.nav-label { color:rgba(255,255,255,.48); text-transform:uppercase; letter-spacing:1.2px; font-size:10px; padding:0 12px; margin-bottom:8px; }
nav { display:grid; gap:6px; }
.nav-btn { border:0; color:rgba(255,255,255,.78); background:transparent; text-align:left; padding:12px 14px; border-radius:10px; display:flex; align-items:center; gap:12px; font-size:14px; transition:.15s; }
.nav-btn:hover,.nav-btn.active { background:rgba(255,255,255,.15); color:white; font-weight:600; }
.nav-icon { width:20px; text-align:center; font-size:16px; }
.side-note { margin-top:auto; background:rgba(255,255,255,.09); border:1px solid rgba(255,255,255,.1); border-radius:13px; padding:14px; font-size:12px; line-height:1.5; color:rgba(255,255,255,.8); }
.side-note b { color:white; display:block; margin-bottom:4px; }

main { min-width:0; padding: 24px 32px 40px; }
.topbar { display:flex; justify-content:space-between; align-items:center; gap:14px; margin-bottom:24px; flex-wrap:wrap; }
.eyebrow { color:var(--muted); font-size:12px; margin-bottom:4px; }
h1 { font-size:clamp(22px, 4vw, 28px); letter-spacing:-.5px; margin:0; font-weight:750; color: #212529; }
.top-actions { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
.date-chip { color:var(--muted); font-size:12px; background:var(--surface); border:1px solid var(--line); padding:10px 14px; border-radius:10px; font-weight:500; }
.primary-btn,.secondary-btn { border:0; border-radius:10px; padding:11px 16px; font-weight:650; font-size:13px; display:inline-flex; align-items:center; justify-content:center; gap:6px; }
.primary-btn { background:var(--site-primary); color:var(--site-on-primary); }
.secondary-btn { background:var(--surface); color:#212529; border:1px solid var(--line); }

.page { display:none; }
.page.active { display:block; }
.section-head { display:flex; justify-content:space-between; align-items:flex-end; gap:12px; margin:4px 0 18px; flex-wrap:wrap; }
.section-head h2 { font-size:18px; margin:0; color: #212529; }
.section-head p { margin:4px 0 0; color:var(--muted); font-size:12px; }

.stats { display:grid; grid-template-columns:repeat(auto-fit, minmax(200px, 1fr)); gap:14px; margin-bottom:20px; }
.stat { background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:16px; box-shadow:var(--shadow); }
.stat-top { display:flex; justify-content:space-between; align-items:center; color:var(--muted); font-size:12px; }
.stat-icon { width:32px;height:32px;display:grid;place-items:center;border-radius:9px;background:var(--surface-2);font-size:15px; }
.stat-value { font-size:24px; font-weight:750; margin-top:10px; color: #212529; }
.stat-foot { color:var(--muted); font-size:11px; margin-top:4px; }

.content-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(280px, 1fr)); gap:16px; }
.panel { background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:18px; box-shadow:var(--shadow); }
.panel-head { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:14px; }
.panel-head h3 { margin:0; font-size:15px; color: #212529; }
