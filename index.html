<style>
:root {
  --site-primary: #253b35;
  --site-on-primary: #ffffff;
  --site-secondary: #e9e3d7;
  --site-on-secondary: #28342f;
  --site-background: #f4f3ef;

  --site-font-body: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;

}
* { box-sizing: border-box; }
body { margin: 0; font-family: var(--site-font-body); background: var(--site-background); color: var(--site-on-background); }
#app { min-height: 100vh; width: 100%; border-radius: 0; background-color: light-dark(var(--site-background), #171d1a); color: light-dark(var(--site-on-background), #edf1ed); }
:root { --surface: light-dark(#ffffff, #222b26); --surface-2: light-dark(#f7f8f5, #29332d); --line: light-dark(#e5e8e2, #39443d); --muted: light-dark(#748078, #a8b3aa); --green: light-dark(#315b49, #9bc5aa); --green-ink: light-dark(#ffffff, #16251c); --red: light-dark(#b84e46, #f09a91); --amber: light-dark(#a8752e, #e8bd72); --shadow: 0 10px 30px rgba(28,42,33,.06); }
button, input, select, textarea { font: inherit; }
button { cursor: pointer; }
.layout { display: grid; grid-template-columns: 248px minmax(0,1fr); min-height: 100vh; }
aside { background: var(--site-primary); color: var(--site-on-primary); padding: calc(25px * var(--site-spacing-scale)) 16px; display: flex; flex-direction: column; gap: 28px; }
.brand { display:flex; align-items:center; gap:12px; padding: 0 10px; }

.brand strong { display:block; font-family:var(--site-font-heading); font-size:calc(15px * var(--site-heading-scale)); letter-spacing:-.3px; }
.brand small { display:block; opacity:.66; font-size:11px; margin-top:3px; }
.nav-label { color:rgba(255,255,255,.48); text-transform:uppercase; letter-spacing:1.2px; font-size:10px; padding:0 12px; margin-bottom:8px; }
nav { display:grid; gap:5px; }
.nav-btn { border:0; color:rgba(255,255,255,.75); background:transparent; text-align:left; padding:12px 13px; border-radius:10px; display:flex; align-items:center; gap:12px; font-size:13px; transition:.15s; }
.nav-btn:hover,.nav-btn.active { background:rgba(255,255,255,.13); color:white; }
.nav-icon { width:19px; text-align:center; font-size:16px; }
.side-note { margin-top:auto; background:rgba(255,255,255,.09); border:1px solid rgba(255,255,255,.1); border-radius:13px; padding:14px; font-size:12px; line-height:1.55; color:rgba(255,255,255,.76); }
.side-note b { color:white; display:block; margin-bottom:4px; }
main { min-width:0; padding: 30px clamp(18px,3.5vw,48px) 50px; }

.top-actions { display:flex; gap:9px; align-items:center; }
.date-chip { color:var(--muted); font-size:12px; background:var(--surface); border:1px solid var(--line); padding:10px 13px; border-radius:10px; }
.primary-btn,.secondary-btn,.danger-btn { border:0; border-radius:10px; padding:10px 14px; font-weight:650; font-size:12px; }
.primary-btn { background:var(--site-primary); color:var(--site-on-primary); }
.secondary-btn { background:var(--surface); color:var(--site-on-background); border:1px solid var(--line); }
.danger-btn { background:light-dark(#fff0ee,#432a28); color:var(--red); }

.page { display:none; }
.page.active { display:block; }

.stats { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:14px; margin-bottom:23px; }

.stat-value { font-size:25px; font-weight:750; letter-spacing:-.8px; margin-top:12px; }
.stat-foot { color:var(--muted); font-size:10px; margin-top:4px; }
.content-grid { display:grid; grid-template-columns:minmax(0,1.5fr) minmax(260px,.9fr); gap:16px; }

.empty { text-align:center; padding:34px 15px; color:var(--muted); font-size:12px; }
.empty .empty-icon { font-size:25px; margin-bottom:9px; }
.list-row { display:flex; align-items:center; gap:11px; padding:12px 0; border-top:1px solid var(--line); }
.avatar { width:35px;height:35px;flex:0 0 35px;border-radius:12px;display:grid;place-items:center;background:var(--site-secondary);color:var(--site-on-secondary);font-weight:750;font-size:12px; }
.row-main { min-width:0; flex:1; }

.pill { display:inline-flex; align-items:center; border-radius:30px; padding:5px 8px; font-size:10px; font-weight:650; background:var(--surface-2); color:var(--muted); white-space:nowrap; }
.pill.paid,.pill.present { background:light-dark(#e6f3e9,#263d2d); color:light-dark(#34764b,#a4d7b1); }
.pill.due,.pill.absent { background:light-dark(#fff0e3,#443426); color:var(--amber); }
.toolbar { display:flex; gap:9px; flex-wrap:wrap; margin-bottom:14px; }
.search { flex:1; min-width:180px; }
input,select,textarea { width:100%; background:var(--surface); color:var(--site-on-background); border:1px solid var(--line); border-radius:9px; padding:10px 11px; outline:none; font-size:12px; }
input:focus,select:focus,textarea:focus { border-color:var(--green); box-shadow:0 0 0 3px light-dark(rgba(49,91,73,.1),rgba(155,197,170,.12)); }
.table-wrap { overflow:auto; border:1px solid var(--line); border-radius:11px; }
table { width:100%; border-collapse:collapse; min-width:650px; }
th { text-align:left; background:var(--surface-2); color:var(--muted); font-size:10px; font-weight:650; padding:11px 12px; }
td { padding:12px; border-top:1px solid var(--line); font-size:11px; }
td b { font-size:11px; }
.actions { display:flex; gap:6px; }
.mini-btn { border:1px solid var(--line); background:var(--surface); color:var(--site-on-background); border-radius:7px; padding:6px 8px; font-size:10px; }
.week-grid { display:grid; grid-template-columns:repeat(7,minmax(105px,1fr)); gap:9px; overflow:auto; padding-bottom:5px; }
.day-col { background:var(--surface); border:1px solid var(--line); border-radius:12px; min-height:190px; padding:10px; }
.day-col.today { border-color:var(--green); box-shadow:inset 0 3px var(--green); }
.day-title { font-size:11px; font-weight:750; margin-bottom:3px; }
.day-date { color:var(--muted); font-size:10px; margin-bottom:12px; }
.lesson-card { background:var(--surface-2); border-left:3px solid var(--green); border-radius:8px; padding:8px; margin-bottom:7px; }
.lesson-card b { display:block; font-size:10px; }
.lesson-card small { display:block; color:var(--muted); font-size:9px; margin-top:4px; }
.lesson-card button { border:0; background:transparent; padding:5px 0 0; color:var(--green); font-size:9px; }
.form-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.field { display:grid; gap:6px; }
.field label { font-size:11px; font-weight:650; color:var(--muted); }
.field.full { grid-column:1/-1; }
.modal-backdrop { position:fixed; inset:0; background:rgba(8,15,11,.48); display:none; align-items:center; justify-content:center; padding:16px; z-index:10; }
.modal-backdrop.open { display:flex; }
.modal { width:min(560px,100%); max-height:90vh; overflow:auto; background:var(--surface); border:1px solid var(--line); border-radius:17px; padding:21px; box-shadow:0 25px 80px rgba(0,0,0,.2); }
.modal-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:18px; }
.modal-head h3 { margin:0; font-size:17px; }
.close { border:0; background:var(--surface-2); color:var(--site-on-background); width:30px;height:30px;border-radius:9px;font-size:17px; }
.modal-actions { display:flex; justify-content:flex-end; gap:8px; margin-top:18px; }
.notice { padding:11px 13px; border-radius:10px; background:var(--surface-2); color:var(--muted); font-size:11px; line-height:1.5; margin-bottom:14px; }
.bar-chart { height:175px; display:flex; align-items:end; gap:10px; padding:10px 2px 0; border-bottom:1px solid var(--line); }
