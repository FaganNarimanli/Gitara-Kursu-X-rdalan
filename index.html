<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gitara Kursu — İdarəetmə</title>
<style>
:root {
  --site-primary: #253b35;
  --site-on-primary: #ffffff;
  --site-secondary: #e9e3d7;
  --site-on-secondary: #28342f;
  --site-background: #f4f3ef;
  --site-on-background: #202923;
  --site-font-body: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --site-font-heading: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --site-heading-scale: 1;
  --site-spacing-scale: 1;
  --site-radius-scale: 1;
  --site-decoration-opacity: 1;
  color-scheme: light dark;
}
* { box-sizing: border-box; }
body { margin: 0; font-family: var(--site-font-body); background: var(--site-background); color: var(--site-on-background); }
#app { min-height: 100vh; width: 100%; border-radius: 0; background-color: light-dark(var(--site-background), #171d1a); color: light-dark(var(--site-on-background), #edf1ed); }
:root { --surface: light-dark(#ffffff, #222b26); --surface-2: light-dark(#f7f8f5, #29332d); --line: light-dark(#e5e8e2, #39443d); --muted: light-dark(#748078, #a8b3aa); --green: light-dark(#315b49, #9bc5aa); --green-ink: light-dark(#ffffff, #16251c); --red: light-dark(#b84e46, #f09a91); --amber: light-dark(#a8752e, #e8bd72); --shadow: 0 10px 30px rgba(28,42,33,.06); }
button, input, select, textarea { font: inherit; }
button { cursor: pointer; }
.layout { display: grid; grid-template-columns: 248px minmax(0,1fr); min-height: 100vh; }
aside { background: var(--site-primary); color: var(--site-on-primary); padding: calc(25px * var(--site-spacing-scale)) 16px; display: flex; flex-direction: column; gap: 28px; }
.brand { display:flex; align-items:center; gap:12px; padding: 0 10px; }
.brand-mark { width:40px; height:40px; border-radius: calc(13px * var(--site-radius-scale)); display:grid; place-items:center; background:rgba(255,255,255,.14); font-size:21px; }
.brand strong { display:block; font-family:var(--site-font-heading); font-size:calc(15px * var(--site-heading-scale)); letter-spacing:-.3px; }
.brand small { display:block; opacity:.66; font-size:11px; margin-top:3px; }
.nav-label { color:rgba(255,255,255,.48); text-transform:uppercase; letter-spacing:1.2px; font-size:10px; padding:0 12px; margin-bottom:8px; }
nav { display:grid; gap:5px; }
.nav-btn { border:0; color:rgba(255,255,255,.75); background:transparent; text-align:left; padding:12px 13px; border-radius:10px; display:flex; align-items:center; gap:12px; font-size:13px; transition:.15s; }
.nav-btn:hover,.nav-btn.active { background:rgba(255,255,255,.13); color:white; }
.nav-icon { width:19px; text-align:center; font-size:16px; }
.side-note { margin-top:auto; background:rgba(255,255,255,.09); border:1px solid rgba(255,255,255,.1); border-radius:13px; padding:14px; font-size:12px; line-height:1.55; color:rgba(255,255,255,.76); }
.side-note b { color:white; display:block; margin-bottom:4px; }
main { min-width:0; padding: 30px clamp(18px,3.5vw,48px) 50px; }
.topbar { display:flex; justify-content:space-between; align-items:center; gap:14px; margin-bottom:30px; }
.eyebrow { color:var(--muted); font-size:12px; margin-bottom:6px; }
h1 { font-family:var(--site-font-heading); font-size:calc(clamp(24px,3vw,31px) * var(--site-heading-scale)); letter-spacing:-1px; margin:0; font-weight:720; }
.top-actions { display:flex; gap:9px; align-items:center; }
.date-chip { color:var(--muted); font-size:12px; background:var(--surface); border:1px solid var(--line); padding:10px 13px; border-radius:10px; }
.primary-btn,.secondary-btn,.danger-btn { border:0; border-radius:10px; padding:10px 14px; font-weight:650; font-size:12px; }
.primary-btn { background:var(--site-primary); color:var(--site-on-primary); }
.secondary-btn { background:var(--surface); color:var(--site-on-background); border:1px solid var(--line); }
.danger-btn { background:light-dark(#fff0ee,#432a28); color:var(--red); }
.primary-btn:hover { filter:brightness(1.12); }
.page { display:none; }
.page.active { display:block; }
.section-head { display:flex; justify-content:space-between; align-items:end; gap:12px; margin:4px 0 18px; }
.section-head h2 { font-size:18px; margin:0; letter-spacing:-.4px; }
.section-head p { margin:5px 0 0; color:var(--muted); font-size:12px; }
.stats { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:14px; margin-bottom:23px; }
.stat { background:var(--surface); border:1px solid var(--line); border-radius:calc(15px * var(--site-radius-scale)); padding:17px; box-shadow:var(--shadow); }
.stat-top { display:flex; justify-content:space-between; align-items:center; color:var(--muted); font-size:11px; }
.stat-icon { width:31px;height:31px;display:grid;place-items:center;border-radius:10px;background:var(--surface-2);font-size:15px; }
.stat-value
