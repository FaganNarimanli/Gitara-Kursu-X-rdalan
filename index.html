<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gitara Kursu — İdarəetmə</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
  --bg: #0b0f0e;
  --surface: #131a17;
  --surface-2: #1b2420;
  --border: #26352f;
  --text: #ffffff;
  --muted: #94a3b8;
  --green: #22c55e;
  --red: #ef4444;
}
* { box-sizing: border-box; }
body { margin: 0; font-family: Inter, system-ui, sans-serif; background: var(--bg); color: var(--text); }
.layout { display: grid; grid-template-columns: 240px minmax(0,1fr); min-height: 100vh; }
aside { background: #111815; border-right: 1px solid var(--border); padding: 20px; display: flex; flex-direction: column; gap: 20px; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: bold; font-size: 16px; color: #fff; }
.brand span { width: 35px; height: 35px; background: #1f352b; display: grid; place-items: center; border-radius: 8px; color: var(--green); }
nav { display: grid; gap: 6px; }
.nav-btn { background: transparent; border: 0; color: var(--muted); text-align: left; padding: 10px 12px; border-radius: 8px; font-size: 13px; cursor: pointer; display: flex; align-items: center; gap: 10px; }
.nav-btn:hover, .nav-btn.active { background: var(--surface-2); color: #fff; }
main { padding: 30px; max-width: 1200px; }
header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
h1 { margin: 0; font-size: 24px; color: #fff; }
.btn { background: var(--green); color: #000; border: 0; padding: 10px 16px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 12px; }
.btn-danger { background: var(--red); color: #fff; }
.btn-secondary { background: var(--surface-2); color: #fff; border: 1px solid var(--border); }
.page { display: none; }
.page.active { display: block; }
.table-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: auto; margin-top: 15px; }
table { width: 100%; border-collapse: collapse; text-align: left; }
th { background: var(--surface-2); color: var(--muted); padding: 12px; font-size: 11px; }
td { padding: 12px; border-top: 1px solid var(--border); font-size: 12px; color: #e2e8f0; }
td b { color: #fff; }
.pill { background: #064e3b; color: #4ade80; padding: 4px 8px; border-radius: 6px; font-size: 10px; font-weight: bold; display: inline-block; }
.modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: none; place-items: center; z-index: 100; padding: 20px; }
.modal-bg.open { display: grid; }
.modal { background: var(--surface); border: 1px solid var(--border); width: min(450px, 100%); padding: 20px; border-radius: 12px; }
.field { margin-bottom: 12px; }
.field label { display: block; font-size: 11px; color: var(--muted); margin-bottom: 4px; }
.field input, .field select { width: 100%; background: var(--surface-2); border: 1px solid var(--border); color: #fff; padding: 10px; border-radius: 8px; outline: none; }
.actions { display: flex; gap: 6px; }
@media(max-width:768px) { .layout { display: block; } aside { display: flex; overflow-x: auto; padding: 10px; } nav { display: flex; } main { padding: 15px; } }
</style>
</head>
<body>
<div class="layout">
  <aside>
    <div class="brand"><span>♬</span> Gitara Kursu</div>
    <nav>
      <button class="nav-btn active" data-page="students">Tələbələr</button>
      <button class="nav-btn" data-page="attendance">Davamiyyət</button>
      <button class="nav-btn" data-page="payments">Ödənişlər & Paketlər</button>
    </nav>
  </aside>
  <main>
    <section class="page active" id="students">
      <header>
        <h1>Tələbələr</h1>
        <button class="btn" onclick="openStudentModal()">＋ Yeni Tələbə</button>
      </header>
      <div class="table-wrap">
        <table>
          <thead><tr><th>AD SOYAD</th><th>TELEFON</th><th>PAKET DƏRSİ</th><th>AYLIQ ÖDƏNİŞ</th><th>ƏMƏLİYYAT</th></tr></thead>
          <tbody id="studentsBody"></tbody>
        </table>
      </div>
    </section>

    <section class="page" id="attendance">
      <header>
        <h1>Davamiyyət</h1>
        <button class="btn" onclick="openAttendanceModal()">＋ Davamiyyət Qeyd Et</button>
      </header>
      <div class="table-wrap">
        <table>
          <thead><tr><th>TARİX</th><th>TƏLƏBƏ</th><th>STATUS</th><th>ƏMƏLİYYAT</th></tr></thead>
          <tbody id="attendanceBody"></tbody>
        </table>
      </div>
    </section>

    <section class="page" id="payments">
      <header>
        <h1>Paket İzləmə</h1>
      </header>
      <div class="table-wrap">
        <table>
          <thead><tr><th>TƏLƏBƏ</th><th>ÜMUMİ PAKET</th><th>KEÇİRİLƏN</th><th>QALAN DƏRS</th></tr></thead>
          <tbody id="packageBody"></tbody>
        </table>
      </div>
    </section>
  </main>
</div>

<div class="modal-bg" id="modalBg">
  <div class="modal">
    <h3 id="modalTitle" style="margin-top:0; color:#fff">Form</h3>
    <form id="modalForm">
      <div id="modalFields"></div>
      <div style="display:flex; justify-content:flex-end; gap:8px; margin-top:15px;">
        <button type="button" class="btn btn-secondary" onclick="closeModal()">Ləğv et</button>
        <button type="submit" class="btn">Yadda saxla</button>
      </div>
    </form>
  </div>
</div>

<script>
// Əgər Supabase istifadə etmək istəmirsinizsə, buraya toxunmayın (avtomatik telefonda/komputerdə öz yaddaşında saxlayacaq). 
// Sinxronizasiya üçün aşağıdakılara öz Supabase URL və Key məlumatlarınızı yazın:
const SUPABASE_URL = "YOUR_SUPABASE_URL";
const SUPABASE_KEY = "YOUR_SUPABASE_ANON_KEY";

let supabaseClient = null;
try {
  if (SUPABASE_URL && SUPABASE_URL !== "YOUR_SUPABASE_URL") {
    supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  }
} catch(e) { console.log(e); }

let data = { students: [], attendance: [] };

async function loadData() {
  try {
    if (supabaseClient) {
      let { data: res } = await supabaseClient.from('course_data').select('content').eq('id', 'main').single();
      if (res && res.content) data = res.content;
    } else {
      data = JSON.parse(localStorage.getItem('gitara_data_v3')) || { students: [], attendance: [] };
    }
  } catch(e) {
    data = JSON.parse(localStorage.getItem('gitara_data_v3')) || { students: [], attendance: [] };
  }
  renderAll();
}

async function saveData() {
  renderAll();
  try {
    if (supabaseClient) {
      await supabaseClient.from('course_data').upsert({ id: 'main', content: data });
    } else {
      localStorage.setItem('gitara_data_v3', JSON.stringify(data));
    }
  } catch(e) {
    localStorage.setItem('gitara_data_v3', JSON.stringify(data));
  }
}

document.querySelectorAll('.nav-btn').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById(btn.dataset.page).classList.add('active');
  };
});

function closeModal() { document.getElementById('modalBg').classList.remove('open'); }
function showModal(title, html, onSubmit) {
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalFields').innerHTML = html;
  document.getElementById('modalBg').classList.add('open');
  document.getElementById('modalForm').onsubmit = (e) => {
    e.preventDefault();
    onSubmit(new FormData(e.target));
    closeModal();
  };
}

function openStudentModal(s = null) {
  showModal(s ? 'Tələbəyə düzəliş et' : 'Yeni Tələbə', `
    <div class="field"><label>Ad Soyad</label><input name="name" value="${s ? s.name : ''}" required></div>
    <div class="field"><label>Telefon</label><input name="phone" value="${s ? s.phone : ''}"></div>
    <div class="field"><label>Paket Dərs Sayı</label><input name="packageSize" type="number" value="${s ? s.packageSize : 8}" required></div>
    <div class="field"><label>Aylıq Məbləğ (AZN)</label><input name="fee" type="number" value="${s ? s.fee : ''}" required></div>
  `, (form) => {
    if (s) {
      s.name = form.get('name');
      s.phone = form.get('phone');
      s.packageSize = Number(form.get('packageSize'));
      s.fee = Number(form.get('fee'));
    } else {
      data.students.push({
        id: crypto.randomUUID(),
        name: form.get('name'),
        phone: form.get('phone'),
        packageSize: Number(form.get('packageSize')),
        fee: Number(form.get('fee'))
      });
    }
    saveData();
  });
}

function deleteStudent(id) {
  if (confirm('Bu tələbəni silmək istədiyinizə əminsiniz?')) {
    data.students = data.students.filter(s => s.id !== id);
    data.attendance = data.attendance.filter(a => a.studentId !== id);
    saveData();
  }
}

function openAttendanceModal() {
  if (data.students.length === 0) { alert('Əvvəlcə tələbə əlavə edin!'); return; }
  let options = data.students.map(s => `<option value="${s.id}">${s.name}</option>`).join('');
  showModal('Davamiyyət Qeyd Et', `
    <div class="field"><label>Tələbə</label><select name="studentId">${options}</select></div>
    <div class="field"><label>Tarix</label><input type="date" name="date" value="${new Date().toISOString().slice(0,10)}" required></div>
    <div class="field"><label>Status</label><select name="status"><option>İştirak edib</option><option>İştirak etməyib</option></select></div>
  `, (form) => {
    data.attendance.push({
      id: crypto.randomUUID(),
      studentId: form.get('studentId'),
      date: form.get('date'),
      status: form.get('status')
    });
    saveData();
  });
}

function deleteAttendance(id) {
  data.attendance = data.attendance.filter(a => a.id !== id);
  saveData();
}

function renderAll() {
  document.getElementById('studentsBody').innerHTML = data.students.map(s => `
    <tr>
      <td><b>${s.name}</b></td>
      <td>${s.phone || '—'}</td>
      <td>${s.packageSize || 8} dərs</td>
      <td>${s.fee} ₼</td>
      <td>
        <div class="actions">
          <button class="btn btn-secondary" style="padding:4px 8px; font-size:10px;" onclick='openStudentModal(${JSON.stringify(s)})'>Düzəliş</button>
          <button class="btn btn-danger" style="padding:4px 8px; font-size:10px;" onclick="deleteStudent('${s.id}')">Sil</button>
        </div>
      </td>
    </tr>
  `).join('') || `<tr><td colspan="5" style="text-align:center; color:var(--muted)">Tələbə yoxdur</td></tr>`;

  document.getElementById('attendanceBody').innerHTML = data.attendance.map(a => {
    let st = data.students.find(s => s.id === a.studentId);
    return `
      <tr>
        <td>${a.date}</td>
        <td><b>${st ? st.name : 'Naməlum'}</b></td>
        <td><span class="pill">${a.status}</span></td>
        <td><button class="btn btn-danger" style="padding:4px 8px; font-size:10px;" onclick="deleteAttendance('${a.id}')">Sil</button></td>
      </tr>
    `;
  }).join('') || `<tr><td colspan="4" style="text-align:center; color:var(--muted)">Davamiyyət qeydi yoxdur</td></tr>`;

  document.getElementById('packageBody').innerHTML = data.students.map(s => {
    let attended = data.attendance.filter(a => a.studentId === s.id && a.status === 'İştirak edib').length;
    let pkgSize = Number(s.packageSize) || 8;
    let currentBatch = attended % pkgSize;
    let remaining = pkgSize - currentBatch;
    return `
      <tr>
        <td><b>${s.name}</b></td>
        <td>${pkgSize} dərslik paket</td>
        <td>${currentBatch} dərs keçilib</td>
        <td><span class="pill">${pkgSize} dərsdən ${remaining}-i qalıb</span></td>
      </tr>
    `;
  }).join('') || `<tr><td colspan="4" style="text-align:center; color:var(--muted)">Aktiv paket yoxdur</td></tr>`;
}

loadData();
</script>
</body>
</html>
